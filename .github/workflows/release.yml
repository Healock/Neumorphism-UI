name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm test:consumer
      - run: npm install --global npm@11.17.0
      - name: Publish package
        run: |
          version=$(node -p "require('./package.json').version")
          tag=$(node -p "const version = require('./package.json').version; version.includes('-') ? version.split('-')[1].split('.')[0] : 'latest'")
          echo "Publishing ${version} with dist-tag ${tag}"
          npm publish --tag "${tag}"
        working-directory: packages/neumorphism-ui
